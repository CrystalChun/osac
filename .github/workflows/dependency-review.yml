---
name: Dependency Review

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Fails the check when a newly-introduced dependency carries a known
      # vulnerability (SCA gate). Pin this SHA when actions/dependency-review-action
      # needs to be bumped.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # GHSA-hrxh-6v49-42gf: google.golang.org/grpc v1.81.1, a pre-existing
          # stale indirect dependency in bare-metal-fulfillment-operator/go.mod
          # (never caught -- that repo's own CI never ran this check), not
          # something introduced by merging it in. Real fix (bump to >=1.82.1)
          # is tracked separately rather than mixed into a code-relocation PR.
          # Remove this allow-list once that fix lands.
          allow-ghsas: GHSA-hrxh-6v49-42gf
