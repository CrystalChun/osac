name: Container build

# Carried over as-is from osac-ui's own standalone repo at merge time, only
# relocated (osac-ui/-prefixed paths) and path-scoped so it runs only on
# osac-ui changes -- a PR-time sanity build, not a publish. That's a
# separate workflow (osac-ui-publish-image.yaml).
on:
  pull_request:
    paths:
      - 'osac-ui/**'

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: podman build -t osac-ui:pr-${{ github.event.pull_request.number }} -f osac-ui/Containerfile osac-ui
