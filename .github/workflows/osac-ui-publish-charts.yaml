name: Publish charts

# Carried over from osac-ui's own standalone repo at merge time, relocated
# (osac-ui/-prefixed paths). NOT yet wired into this repo's own release
# conventions -- see osac-ui-publish-image.yaml's header for why its
# `tags: ['v*']` trigger (and so this workflow_run chain) has no real
# trigger path today. Two things here specifically still assume the
# standalone repo and need phase-2 redesign, not just a path fix:
#   1. REPO is hardcoded to osac-project/osac-ui (matching
#      osac-ui-publish-image.yaml's IMAGE_NAME) so the chart's pinned image
#      reference stays correct -- but ${{ github.repository }} used to
#      double as "which repo do I push this chart/release to", and that
#      repo is now archived and read-only.
#   2. The final `gh release create --repo` step will fail outright once
#      osac-ui is archived -- releases need to move to osac-project/osac
#      with a component-prefixed tag (osac-ui/vX.Y.Z), matching how every
#      other mono-repo component's release is tagged and recorded.
on:
  workflow_run:
    workflows: ["Publish container image"]
    types: [completed]

env:
  REPO: osac-project/osac-ui

jobs:

  guard:
    name: Verify image build succeeded
    runs-on: ubuntu-latest
    # Read-only job: only inspects workflow_run event metadata, no repo/API access needed.
    permissions: {}
    if: >
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    outputs:
      tag: ${{ github.event.workflow_run.head_branch }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
    - name: Check image build result
      env:
        CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      run: |
        # No build-metadata (+...) suffix allowed: this tag is used verbatim as a
        # container image tag downstream, and Docker/OCI tags cannot contain '+'.
        semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
        if ! [[ "$HEAD_BRANCH" =~ $semver_re ]]; then
          echo "::error::Tag '$HEAD_BRANCH' is not a valid semver release tag"
          exit 1
        fi
        if [[ "$CONCLUSION" != "success" ]]; then
          echo "::error::Image build for tag $HEAD_BRANCH did not succeed (conclusion: $CONCLUSION). Refusing to publish chart."
          exit 1
        fi
        echo "Image build succeeded for tag $HEAD_BRANCH"

  publish-ui-chart:
    name: Publish UI chart
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # cosign's keyless chart signing below -- safe directly on this job,
      # no pull_request exposure: this workflow only ever runs via
      # workflow_run after a tag-triggered image build already succeeded.
      id-token: write
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        ref: ${{ needs.guard.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

    - name: Verify tag still points at the guarded commit
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.guard.outputs.tag }}
        GUARDED_SHA: ${{ needs.guard.outputs.sha }}
      run: osac-ui/.github/scripts/verify-tag-matches-sha.sh

    - id: run
      env:
        TAG: ${{ needs.guard.outputs.tag }}
        REGISTRY_USERNAME: ${{ github.actor }}
        REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      working-directory: osac-ui
      run: |
        # Login to the registry:
        export registry="ghcr.io"
        echo "${REGISTRY_PASSWORD}" | helm registry login --username "${REGISTRY_USERNAME}" --password-stdin "${registry}"

        # Get the git version from the tag that triggered the image build:
        export git_version="${TAG}"

        # Update the image reference in the chart:
        export app_version="${git_version}"
        export app_image="${registry}/${REPO}:${app_version}"
        yq -i '.images.ui = strenv(app_image)' charts/ui/values.yaml

        # Package the chart:
        export chart_version="${git_version#v}"
        helm package charts/ui --version "${chart_version}" --app-version "${app_version}"

        # Push the chart to the registry:
        export chart_name="$(yq -r '.name' charts/ui/Chart.yaml)"
        export chart_file="${chart_name}-${chart_version}.tgz"
        oci_repo="${registry}/${{ github.repository_owner }}/charts"
        output=$(helm push "${chart_file}" "oci://${oci_repo}" 2>&1)
        echo "${output}"
        digest=$(grep -oE '^Digest: sha256:[0-9a-f]+' <<<"${output}" | cut -d' ' -f2)
        if [[ -z "${digest}" ]]; then
          echo "::error::Could not parse digest from helm push output"
          exit 1
        fi
        cosign sign --yes "${oci_repo}/${chart_name}@${digest}"

    - name: Verify tag still points at the guarded commit
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.guard.outputs.tag }}
        GUARDED_SHA: ${{ needs.guard.outputs.sha }}
      run: osac-ui/.github/scripts/verify-tag-matches-sha.sh

    - name: Create GitHub Release
      run: |
        gh release create "${TAG}" \
          --repo "${REPO}" \
          --title "osac-ui ${TAG}" \
          --generate-notes \
          --verify-tag \
        || gh release edit "${TAG}" \
          --repo "${REPO}" \
          --title "osac-ui ${TAG}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.guard.outputs.tag }}
