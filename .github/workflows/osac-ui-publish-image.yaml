name: Publish container image

# Carried over from osac-ui's own standalone repo at merge time, relocated
# (osac-ui/-prefixed paths) and path-scoped to osac-ui/** so a mono-repo
# push touching unrelated components doesn't trigger it. NOT yet wired
# into this repo's own tag/release conventions (every other mono-repo
# component publishes via osac-build-and-publish.yaml and tags as
# <component>/vX.Y.Z, not a bare vX.Y.Z push) -- that redesign is a
# deliberate follow-up, not part of this move. Until it lands, the
# `tags: ['v*']` branch below has no real trigger path (nothing pushes a
# bare vX.Y.Z tag to this repo), so only the branch-push path is live,
# same as it always was for this workflow.
#
# IMAGE_NAME is hardcoded rather than derived from ${{ github.repository }}
# (which now resolves to osac-project/osac, not osac-project/osac-ui) --
# every existing chart/values reference still points at
# ghcr.io/osac-project/osac-ui, so the published image name must not
# change as a side effect of where the source code happens to live.
on:
  push:
    branches:
      - main
    paths:
      - 'osac-ui/**'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # cosign's keyless image signing below -- safe directly on this job, no
  # pull_request exposure: this workflow only ever runs on push (main or a
  # release tag).
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: osac-project/osac-ui

jobs:
  publish:
    name: Build and publish container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: osac-ui
          file: osac-ui/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
