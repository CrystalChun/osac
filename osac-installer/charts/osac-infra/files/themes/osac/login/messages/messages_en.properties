# OSAC Custom Error Messages for Identity Provider Failures
# These override the default Keycloak messages with more user-friendly explanations

# Generic IDP error - shown when the IDP provider is unreachable or returns an error
identityProviderUnexpectedErrorMessage=Unable to authenticate with the identity provider. The identity provider may be temporarily unavailable or misconfigured. Please contact your administrator for assistance.

# IDP not found error
identityProviderNotFoundMessage=The requested identity provider could not be found. Please contact your administrator.

# IDP authentication failed - shown when the external OIDC provider rejects authentication
identityProviderAuthenticationFailed=Authentication with the identity provider failed. Please verify your credentials or contact your administrator.

# IDP link error - shown when linking/unlinking accounts fails
identityProviderLinkError=Unable to link your account with the identity provider. Please try again or contact your administrator.

# IDP disabled error
identityProviderDisabledMessage=This identity provider is currently disabled. Please contact your administrator.

# Generic broker error (parent category for IDP errors)
brokerLinkingSessionExpired=The identity provider authentication session has expired. Please try logging in again.

# Token exchange errors
identityProviderInvalidResponseMessage=The identity provider returned an invalid response. This may indicate a configuration issue. Please contact your administrator.

# Missing configuration
identityProviderMissingClientIdMessage=The identity provider is missing required configuration (Client ID). Please contact your administrator.
identityProviderMissingClientSecretMessage=The identity provider is missing required configuration (Client Secret). Please contact your administrator.

# Network/connectivity errors
identityProviderNetworkErrorMessage=Unable to connect to the identity provider. The provider may be unreachable or the network connection failed. Please try again later or contact your administrator.

# OAuth/OIDC specific errors
identityProviderInvalidTokenMessage=The identity provider returned an invalid or expired token. Please try logging in again.
identityProviderInvalidIssuerMessage=The identity provider''s issuer does not match the expected value. This may indicate a configuration issue or security concern. Please contact your administrator.

# Certificate/SSL errors
identityProviderSslErrorMessage=Unable to establish a secure connection with the identity provider due to an SSL/TLS error. Please contact your administrator.

# Help text for admins
identityProviderAdminNote=Note to administrators: Check the Identity Provider status in the OSAC console. The provider''s phase and error message may contain additional details.
