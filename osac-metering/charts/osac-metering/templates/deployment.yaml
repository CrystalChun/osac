apiVersion: apps/v1
kind: Deployment
metadata:
  name: osac-metering
  labels:
    app.kubernetes.io/name: osac-metering
    app.kubernetes.io/component: metering
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: osac-metering
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osac-metering
        app.kubernetes.io/component: metering
    spec:
      serviceAccountName: osac-metering
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: kafka-credentials
          secret:
            secretName: {{ include "osac-metering.kafkaSaslSecretName" . }}
        - name: kafka-ca
          secret:
            secretName: {{ include "osac-metering.kafkaCaSecret" . }}
        - name: ca-bundle
          configMap:
            name: {{ .Values.certs.caBundle.configMap }}
      containers:
        - name: osac-metering
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: FULFILLMENT_SERVER_ADDRESS
              value: {{ .Values.fulfillment.address | quote }}
            - name: TLS_CA_CERT
              value: /etc/ca-bundle/bundle.pem
            - name: KAFKA_BROKERS
              value: {{ include "osac-metering.kafkaBrokers" . | quote }}
            - name: KAFKA_TOPIC
              value: {{ include "osac-metering.kafkaTopic" . | quote }}
            - name: KAFKA_TLS_CA_CERT
              value: /etc/kafka-ca/ca.crt
            - name: KAFKA_SASL_USERNAME
              value: {{ include "osac-metering.kafkaSaslUsername" . | quote }}
            - name: KAFKA_SASL_PASSWORD_FILE
              value: /etc/kafka-credentials/password
          volumeMounts:
            - name: kafka-credentials
              mountPath: /etc/kafka-credentials
              readOnly: true
            - name: kafka-ca
              mountPath: /etc/kafka-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ca-bundle
              readOnly: true
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
