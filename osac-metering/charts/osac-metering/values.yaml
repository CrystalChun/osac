image:
  repository: ghcr.io/osac-project/metering-service
  tag: latest
  pullPolicy: Always

# Assumes co-located deployment. Cross-namespace/cross-cluster support
# tracked in OSAC-3537.
fulfillment:
  address: "fulfillment-service.osac.svc.cluster.local:8001"

certs:
  caBundle:
    configMap: ca-bundle

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
