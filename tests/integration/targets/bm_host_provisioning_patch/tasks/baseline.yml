---
- name: BMH Patch Construction - OCI image omits checksum
  hosts: localhost
  gather_facts: false

  vars:
    bm_host_metal3_default_image_url: >-
      https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
    bm_host_metal3_default_image_checksum: "28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
    bm_host_metal3_default_checksum_type: "sha256"

  tasks:
    - name: Test OCI image - set template_params with oci:// URL
      ansible.builtin.set_fact:
        template_params:
          imageURL: "oci://quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:abc123"
          sshPublicKey: ""

    - name: Apply image defaults to template parameters
      ansible.builtin.set_fact:
        template_params: "{{ {'imageURL': bm_host_metal3_default_image_url,
                              'imageChecksum': bm_host_metal3_default_image_checksum,
                              'checksumType': bm_host_metal3_default_checksum_type}
                            | combine(template_params) }}"

    - name: Build base BMH patch
      ansible.builtin.set_fact:
        bmh_patch:
          spec:
            image:
              url: "{{ template_params.imageURL }}"
            online: true

    - name: Add checksum to BMH patch for non-OCI images
      when: not template_params.imageURL.startswith('oci://')
      ansible.builtin.set_fact:
        bmh_patch: >-
          {{ bmh_patch | combine({
               'spec': bmh_patch.spec | combine({
                 'image': bmh_patch.spec.image | combine({
                   'checksum': template_params.imageChecksum,
                   'checksumType': template_params.checksumType
                 })
               })
             }, recursive=True) }}

    - name: Assert OCI image patch has no checksum fields
      ansible.builtin.assert:
        that:
          - bmh_patch.spec.image.url == "oci://quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:abc123"
          - "'checksum' not in bmh_patch.spec.image"
          - "'checksumType' not in bmh_patch.spec.image"
        fail_msg: "OCI image BMH patch must not contain checksum or checksumType"

- name: BMH Patch Construction - Non-OCI image includes checksum
  hosts: localhost
  gather_facts: false

  vars:
    bm_host_metal3_default_image_url: >-
      https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
    bm_host_metal3_default_image_checksum: "28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
    bm_host_metal3_default_checksum_type: "sha256"

  tasks:
    - name: Test qcow2 image - set template_params with https URL
      ansible.builtin.set_fact:
        template_params:
          imageURL: "https://example.com/image.qcow2"
          imageChecksum: "deadbeef1234"
          checksumType: "md5"

    - name: Apply image defaults to template parameters
      ansible.builtin.set_fact:
        template_params: "{{ {'imageURL': bm_host_metal3_default_image_url,
                              'imageChecksum': bm_host_metal3_default_image_checksum,
                              'checksumType': bm_host_metal3_default_checksum_type}
                            | combine(template_params) }}"

    - name: Build base BMH patch
      ansible.builtin.set_fact:
        bmh_patch:
          spec:
            image:
              url: "{{ template_params.imageURL }}"
            online: true

    - name: Add checksum to BMH patch for non-OCI images
      when: not template_params.imageURL.startswith('oci://')
      ansible.builtin.set_fact:
        bmh_patch: >-
          {{ bmh_patch | combine({
               'spec': bmh_patch.spec | combine({
                 'image': bmh_patch.spec.image | combine({
                   'checksum': template_params.imageChecksum,
                   'checksumType': template_params.checksumType
                 })
               })
             }, recursive=True) }}

    - name: Assert non-OCI image patch includes checksum fields
      ansible.builtin.assert:
        that:
          - bmh_patch.spec.image.url == "https://example.com/image.qcow2"
          - bmh_patch.spec.image.checksum == "deadbeef1234"
          - bmh_patch.spec.image.checksumType == "md5"
        fail_msg: "Non-OCI image BMH patch must contain checksum and checksumType"

- name: BMH Patch Construction - Default image includes checksum
  hosts: localhost
  gather_facts: false

  vars:
    bm_host_metal3_default_image_url: >-
      https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
    bm_host_metal3_default_image_checksum: "28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
    bm_host_metal3_default_checksum_type: "sha256"

  tasks:
    - name: Test default image - set empty template_params
      ansible.builtin.set_fact:
        template_params: {}

    - name: Apply image defaults to template parameters
      ansible.builtin.set_fact:
        template_params: "{{ {'imageURL': bm_host_metal3_default_image_url,
                              'imageChecksum': bm_host_metal3_default_image_checksum,
                              'checksumType': bm_host_metal3_default_checksum_type}
                            | combine(template_params) }}"

    - name: Build base BMH patch
      ansible.builtin.set_fact:
        bmh_patch:
          spec:
            image:
              url: "{{ template_params.imageURL }}"
            online: true

    - name: Add checksum to BMH patch for non-OCI images
      when: not template_params.imageURL.startswith('oci://')
      ansible.builtin.set_fact:
        bmh_patch: >-
          {{ bmh_patch | combine({
               'spec': bmh_patch.spec | combine({
                 'image': bmh_patch.spec.image | combine({
                   'checksum': template_params.imageChecksum,
                   'checksumType': template_params.checksumType
                 })
               })
             }, recursive=True) }}

    - name: Assert default image patch includes checksum fields
      ansible.builtin.assert:
        that:
          - bmh_patch.spec.image.checksum == bm_host_metal3_default_image_checksum
          - bmh_patch.spec.image.checksumType == bm_host_metal3_default_checksum_type
        fail_msg: "Default (non-OCI) image BMH patch must contain checksum and checksumType from defaults"
